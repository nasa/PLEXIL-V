default:
  image: plexil-6-base:latest

before_script:
  - git submodule update --init --recursive
  - cd $PLEXIL_HOME
  - git fetch
  - git checkout $(git -C $CI_PROJECT_DIR rev-parse HEAD:plexil)
  - git submodule update --init --recursive
  - make tools -j
  - cd $CI_PROJECT_DIR/python/plexilv-cli
  - source /bootstrap/python/.venv/bin/activate
  - pip install -e .[dev] --force-reinstall --no-deps
  - cd $CI_PROJECT_DIR/python/pyplexil-plexilv
  - pip install -e . --force-reinstall --no-deps
  - cd $CI_PROJECT_DIR/python/plexilv-log
  - pip install -e . --force-reinstall --no-deps
  - cd $CI_PROJECT_DIR

stages:
  - test

plexilv_python_tests:
  stage: test
  script:
    - cd $CI_PROJECT_DIR/python
    - ./run_all_tests.sh

semantics_unit_tests:
  stage: test
  script:
    - cd $CI_PROJECT_DIR/semantics
    - ./runTests.sh --check

semantics_acceptance_tests:
  stage: test
  script:
    - export PATH=/plexil/scripts:/plexil/bin:$PATH
    - cd $CI_PROJECT_DIR/semantics
    - ./runAT.sh --check
  artifacts:
    when: always
    paths:
      - $CI_PROJECT_DIR/test/icarous/ci/*
    expire_in: 2 days

semantics_regression_tests:
  stage: test
  script:
    - export PATH=/plexil/scripts:/plexil/bin:$PATH
    - cd $CI_PROJECT_DIR/semantics/test/regression
    - python3 runRegression.py -p

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
