[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plexilv-stepper"
version = "0.1.0"
description = "PLEXIL-V step-by-step plan execution using the PLEXIL-V formal semantics"
requires-python = ">=3.9"
dependencies = [
    "maude",
    "click>=8.0",
]

[project.scripts]
plexilv-stepper = "plexilv_stepper.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
]