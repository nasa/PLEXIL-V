[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyplexil-core"
version = "1.0.0"
description = "Core parsing logic for PLEXIL"
requires-python = ">=3.10"
dependencies = [
    "xsdata",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["plexil*"]
